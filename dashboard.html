<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiSense Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07070e;
      --surface:   #0e0e1c;
      --surface2:  #13132a;
      --border:    #1c1c38;
      --text:      #ddddf5;
      --muted:     #5a5a80;
      --accent:    #7b8de8;

      --green:     #3ddc84;
      --green-dim: #1a4a30;
      --green-bg:  radial-gradient(ellipse at 50% 60%, #051a0f 0%, #07070e 70%);

      --red:       #f06060;
      --red-dim:   #4a1515;
      --red-bg:    radial-gradient(ellipse at 50% 60%, #1a0505 0%, #07070e 70%);

      --blue:      #5b9cf6;
      --blue-dim:  #1a2a50;
      --blue-bg:   radial-gradient(ellipse at 50% 60%, #080820 0%, #07070e 70%);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logo h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .logo span {
      font-weight: 400;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conn-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .conn-badge.on   { color: var(--green); }
    .conn-badge.on   .conn-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .conn-badge.sim  { color: var(--accent); }
    .conn-badge.sim  .conn-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    .btn {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #1a1a35; border-color: #2a2a50; }
    .btn:disabled { opacity: 0.3; cursor: default; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #8fa0f0; }

    .btn-danger {
      background: #2a0a0a;
      border-color: #5a1a1a;
      color: var(--red);
    }
    .btn-danger:hover { background: #350d0d; }

    /* ── compat warning ───────────────────────────────────────────────────── */
    .warn {
      background: #14100a;
      border-bottom: 1px solid #2a2010;
      padding: 8px 28px;
      font-size: 0.78rem;
      color: #c0a040;
      display: none;
    }
    .warn.show { display: block; }

    /* ── main grid ────────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 0;
    }

    /* ── left: status panel ───────────────────────────────────────────────── */
    .status-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      border-right: 1px solid var(--border);
      gap: 20px;
      background: var(--bg);
      transition: background 0.6s ease;
      position: relative;
      overflow: hidden;
    }

    .status-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .status-panel.occ-clear::before   { background: var(--green-bg); opacity: 1; }
    .status-panel.occ-occupied::before{ background: var(--red-bg);   opacity: 1; }
    .status-panel.occ-cal::before     { background: var(--blue-bg);  opacity: 1; }

    .status-eyebrow {
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      position: relative;
    }

    .status-card {
      width: 100%;
      padding: 28px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      transition: border-color 0.4s, background 0.4s;
    }

    .status-panel.occ-occupied .status-card {
      border-color: var(--red-dim);
      background: rgba(240,96,96,0.04);
    }
    .status-panel.occ-clear .status-card {
      border-color: var(--green-dim);
      background: rgba(61,220,132,0.04);
    }
    .status-panel.occ-cal .status-card {
      border-color: var(--blue-dim);
      background: rgba(91,156,246,0.04);
    }

    .status-icon {
      font-size: 2.6rem;
      line-height: 1;
      filter: grayscale(1);
      transition: filter 0.4s;
    }
    .status-panel.occ-occupied .status-icon { filter: grayscale(0); }
    .status-panel.occ-clear    .status-icon { filter: grayscale(0); }
    .status-panel.occ-cal      .status-icon { filter: grayscale(0); }

    .status-text {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.2;
      color: var(--muted);
      white-space: pre;
      transition: color 0.4s;
    }
    .status-panel.occ-occupied .status-text { color: var(--red); }
    .status-panel.occ-clear    .status-text { color: var(--green); }
    .status-panel.occ-cal      .status-text { color: var(--accent); font-size: 1.1rem; font-weight: 600; }

    .status-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.4s;
    }
    .status-ring-inner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s, box-shadow 0.4s;
    }

    .status-panel.occ-occupied .status-ring { border-color: var(--red-dim); }
    .status-panel.occ-occupied .status-ring-inner {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    .status-panel.occ-clear .status-ring { border-color: var(--green-dim); }
    .status-panel.occ-clear .status-ring-inner {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-panel.occ-cal .status-ring { border-color: var(--blue-dim); }
    .status-panel.occ-cal .status-ring-inner {
      background: var(--accent);
      animation: pulse-dot 1s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* variance bar */
    .var-bar-wrap {
      width: 100%;
      position: relative;
    }

    .var-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .var-bar-track {
      height: 4px;
      border-radius: 2px;
      background: var(--surface2);
      overflow: hidden;
    }

    .var-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      width: 0%;
      transition: width 0.5s ease, background 0.4s;
    }

    /* ── right: chart panel ───────────────────────────────────────────────── */
    .chart-panel {
      display: flex;
      flex-direction: column;
      padding: 22px 26px 18px;
      gap: 14px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
    }

    .chart-meta {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .chart-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 14px 8px;
    }

    /* ── stats bar ────────────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 28px;
      display: flex;
      gap: 0;
      flex-shrink: 0;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 20px 0 0;
      border-right: 1px solid var(--border);
      margin-right: 20px;
    }
    .stat:last-child { border-right: none; margin-right: 0; }

    .stat-name {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }
    .stat-val.lit { color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    <h1>WiSense <span>/ CSI Dashboard</span></h1>
  </div>
  <div class="header-right">
    <div id="connBadge" class="conn-badge">
      <span class="conn-dot"></span>
      <span id="connText">Disconnected</span>
    </div>
    <button class="btn" id="simBtn">Simulate</button>
    <button class="btn btn-primary" id="connectBtn">Connect to ESP32</button>
  </div>
</header>

<div id="warnBanner" class="warn">
  ⚠ Web Serial API not available — use Chrome or Edge (v89+). Simulate works in any browser.
</div>

<main>

  <!-- Left: occupancy status -->
  <div id="statusPanel" class="status-panel">
    <div class="status-eyebrow">Occupancy Status</div>

    <div class="status-card">
      <div id="statusIcon" class="status-icon">📡</div>
      <div id="statusText" class="status-text">—</div>
      <div class="status-ring">
        <div class="status-ring-inner"></div>
      </div>
    </div>

    <div class="var-bar-wrap">
      <div class="var-bar-label">
        <span>Variance</span>
        <span id="varNum">—</span>
      </div>
      <div class="var-bar-track">
        <div id="varBarFill" class="var-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Right: chart -->
  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-title">Mean CSI Amplitude over Time</div>
      <div class="chart-meta">last 60 readings · 2 Hz</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>

</main>

<footer>
  <div class="stat">
    <div class="stat-name">Amplitude</div>
    <div class="stat-val" id="sAmp">—</div>
  </div>
  <div class="stat">
    <div class="stat-name">Mean</div>
    <div class="stat-val" id="sMean">—</div>
  </div>
  <div class="stat">
    <div class="stat-name">Variance</div>
    <div class="stat-val" id="sVar">—</div>
  </div>
  <div class="stat">
    <div class="stat-name">Std Dev</div>
    <div class="stat-val" id="sStd">—</div>
  </div>
  <div class="stat">
    <div class="stat-name">Threshold</div>
    <div class="stat-val lit">150 / 600</div>
  </div>
  <div class="stat">
    <div class="stat-name">Lines Rx</div>
    <div class="stat-val" id="sPkts">0</div>
  </div>
</footer>

<script>
// ── chart ──────────────────────────────────────────────────────────────────────
const MAX = 60;
const cLabels = [], cData = [];

const gradient = (() => {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 300);
  g.addColorStop(0,   'rgba(91,156,246,0.3)');
  g.addColorStop(1,   'rgba(91,156,246,0)');
  return g;
})();

const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: cLabels,
    datasets: [{
      data: cData,
      borderColor: '#5b9cf6',
      backgroundColor: gradient,
      fill: true,
      tension: 0.4,
      pointRadius: 0,
      borderWidth: 2,
    }]
  },
  options: {
    animation: false,
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'none' },
    scales: {
      x: { display: false },
      y: {
        min: 0, max: 120,
        grid:   { color: 'rgba(255,255,255,0.03)' },
        border: { color: 'transparent' },
        ticks:  { color: '#3a3a60', font: { size: 10 }, stepSize: 20 },
      }
    },
    plugins: { legend: { display: false } }
  }
});

function pushPoint(mean) {
  cLabels.push('');
  cData.push(mean);
  if (cLabels.length > MAX) { cLabels.shift(); cData.shift(); }
  chart.update('none');
}

// ── UI ─────────────────────────────────────────────────────────────────────────
let totalLines = 0;

function setStatus(status) {
  const panel = document.getElementById('statusPanel');
  const text  = document.getElementById('statusText');
  const icon  = document.getElementById('statusIcon');

  panel.className = 'status-panel';

  if (status === 'Occupied') {
    panel.classList.add('occ-occupied');
    icon.textContent  = '🔴';
    text.textContent  = 'OCCUPIED';
    text.style.whiteSpace = '';
  } else if (status === 'Not Occupied') {
    panel.classList.add('occ-clear');
    icon.textContent  = '🟢';
    text.textContent  = 'NOT\nOCCUPIED';
    text.style.whiteSpace = 'pre';
  } else if (status === 'Calibrating') {
    panel.classList.add('occ-cal');
    icon.textContent  = '📡';
    text.textContent  = 'Calibrating…';
    text.style.whiteSpace = '';
  } else {
    icon.textContent  = '📡';
    text.textContent  = '—';
    text.style.whiteSpace = '';
  }
}

function setConn(text, cls) {
  const badge = document.getElementById('connBadge');
  badge.className = 'conn-badge' + (cls ? ' ' + cls : '');
  document.getElementById('connText').textContent = text;
}

function updateVarianceBar(variance) {
  const fill = document.getElementById('varBarFill');
  const num  = document.getElementById('varNum');
  const pct  = Math.min(100, (variance / 800) * 100);
  fill.style.width = pct + '%';
  fill.style.background = variance < 150 ? '#3ddc84' : variance > 600 ? '#f06060' : '#f0a060';
  num.textContent = variance.toFixed(0);
}

function updateStats({ amp, mean, variance, std }) {
  totalLines++;
  document.getElementById('sAmp').textContent  = amp.toFixed(1);
  document.getElementById('sMean').textContent = mean.toFixed(1);
  document.getElementById('sVar').textContent  = variance.toFixed(1);
  document.getElementById('sStd').textContent  = std.toFixed(2);
  document.getElementById('sPkts').textContent = totalLines.toLocaleString();
  ['sAmp','sMean','sVar','sStd','sPkts'].forEach(id =>
    document.getElementById(id).className = 'stat-val lit');
  updateVarianceBar(variance);
}

function resetUI() {
  setStatus(null);
  setConn('Disconnected');
  ['sAmp','sMean','sVar','sStd'].forEach(id => {
    document.getElementById(id).textContent = '—';
    document.getElementById(id).className = 'stat-val';
  });
  document.getElementById('sPkts').textContent = '0';
  document.getElementById('varNum').textContent = '—';
  document.getElementById('varBarFill').style.width = '0%';
}

// ── parser ─────────────────────────────────────────────────────────────────────
function parseLine(line) {
  if (!line.startsWith('DATA,')) return null;
  const p = line.split(',');
  if (p.length < 7) return null;
  return {
    amp:      parseFloat(p[2]),
    mean:     parseFloat(p[3]),
    variance: parseFloat(p[4]),
    std:      parseFloat(p[5]),
    status:   p.slice(6).join(',').trim(),
  };
}

function handle(parsed) {
  if (!parsed) return;
  if (parsed.mean > 0) pushPoint(parsed.mean);
  updateStats(parsed);
  setStatus(parsed.status);
}

// ── simulation ─────────────────────────────────────────────────────────────────
const SIM_WIN = 20;
let simTimer = null, simTick = 0, simAmps = [];

function simPhase(t) {
  if (t < 10) return { base: 45, noise: 2 };
  return (t - 10) % 100 < 50 ? { base: 46, noise: 9 } : { base: 40, noise: 35 };
}

function simStep() {
  simTick++;
  const { base, noise } = simPhase(simTick);
  const amp = base + (Math.random() * 2 - 1) * noise;
  simAmps.push(amp);
  if (simAmps.length > SIM_WIN) simAmps.shift();
  const n   = simAmps.length;
  const mean = simAmps.reduce((s, v) => s + v, 0) / n;
  const variance = simAmps.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
  handle({
    amp, mean, variance,
    std: Math.sqrt(variance),
    status: n < 10 ? 'Calibrating' : variance < 150 ? 'Not Occupied' : 'Occupied',
  });
}

document.getElementById('simBtn').addEventListener('click', () => {
  if (simTimer) {
    clearInterval(simTimer); simTimer = null;
    document.getElementById('simBtn').textContent = 'Simulate';
    document.getElementById('simBtn').className = 'btn';
    document.getElementById('connectBtn').disabled = !('serial' in navigator);
    resetUI();
  } else {
    simTick = 0; simAmps = []; totalLines = 0;
    document.getElementById('simBtn').textContent = 'Stop Sim';
    document.getElementById('simBtn').className = 'btn btn-danger';
    document.getElementById('connectBtn').disabled = true;
    setConn('Simulating', 'sim');
    simTimer = setInterval(simStep, 500);
  }
});

// ── web serial ─────────────────────────────────────────────────────────────────
if (!('serial' in navigator)) {
  document.getElementById('warnBanner').classList.add('show');
  document.getElementById('connectBtn').disabled = true;
}

let port = null, reader = null;

document.getElementById('connectBtn').addEventListener('click', async () => {
  port ? await doDisconnect() : await doConnect();
});

async function doConnect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    totalLines = 0;
    setConn('Connected', 'on');
    document.getElementById('connectBtn').textContent = 'Disconnect';
    document.getElementById('connectBtn').className = 'btn btn-danger';
    document.getElementById('simBtn').disabled = true;
    readLoop();
  } catch (e) {
    port = null;
    if (e.name !== 'AbortError') alert('Could not open port: ' + e.message);
  }
}

async function doDisconnect() {
  if (reader) { try { await reader.cancel(); } catch (_) {} reader = null; }
  if (port)   { try { await port.close();    } catch (_) {} port   = null; }
  resetUI();
  document.getElementById('connectBtn').textContent = 'Connect to ESP32';
  document.getElementById('connectBtn').className = 'btn btn-primary';
  document.getElementById('simBtn').disabled = false;
}

async function readLoop() {
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable);
  reader = dec.readable.getReader();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines) handle(parseLine(l.trim()));
    }
  } catch (e) {
    if (e.name !== 'AbortError') { console.error(e); doDisconnect(); }
  } finally { try { reader.releaseLock(); } catch (_) {} }
}
</script>
</body>
</html>
